<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status == 404 ? 'Página não encontrada' : (status == 503 ? 'Aplicativo em manutenção' : (status != null and status >= 500 ? 'Erro interno do servidor' : 'Erro'))} + ' - AgroFraiburgo'">Erro - AgroFraiburgo</title>

    <link rel="icon" href="/imagens/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/estilos-pagina_inicial.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;700&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --green: #28a645;
            --green-dark: #1f7f37;
            --text: #293042;
            --muted: #6b7280;
            --surface: rgba(255, 255, 255, 0.964);
            --border: rgba(41, 48, 66, 0.08);
            --shadow: 0 22px 60px rgba(31, 127, 55, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Sofia Sans', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(40, 166, 69, 0.12), transparent 28%),
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.10), transparent 26%),
                linear-gradient(180deg, #f8fbf7 0%, #edf4ec 100%);
            min-height: 100vh;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
        }

        .page_404 {
            padding: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-error {
            position: relative;
            border-radius: 30px;
            padding: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .fa-home { color: #fff; }

        .four_zero_four_bg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-image {
            max-width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: contain;
            opacity: 0.9;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .error-code {
            margin-top: -28px;
            font-size: clamp(4rem, 10vw, 6rem);
            font-weight: 800;
            color: var(--green);
        }

        .contant_box_404 {
            max-width: 600px;
            margin: 0 auto;
        }

        .h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .text-404 {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
            background: rgba(40, 166, 69, 0.1);
            color: var(--green-dark);
            font-weight: 600;
        }

        .actions {
            margin-top: 20px;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--green), #3bb85a);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) {
            .error-image {
                max-height:180px;
            }
        }
    </style>
</head>

<body>

<main>
    <section class="page_404">
        <div class="container">
            <div class="hero-error">

                <div class="four_zero_four_bg">
                    <img src="https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif" alt="Erro" class="error-image">
                    <h1 class="error-code" th:text="${status != null ? status : 500}">500</h1>
                </div>

                <div class="contant_box_404">

                    <div class="status-pill" th:if="${status == 404}">
                        <i class="fas fa-location-crosshairs"></i>
                        Página não encontrada
                    </div>

                    <div class="status-pill" th:if="${status == 503}">
                        <i class="fas fa-triangle-exclamation"></i>
                        Aplicativo em manutenção
                    </div>

                    <div class="status-pill" th:if="${status >= 500 and status != 503}">
                        <i class="fas fa-bug"></i>
                        Erro interno do servidor
                    </div>

                    <h3 class="h2">Algo não saiu como esperado</h3>

                    <p class="text-404">
                        Ocorreu um problema ao processar sua solicitação.
                        Tente novamente ou volte para a página inicial.
                    </p>

                    <div class="actions">
                        <a th:href="${homeUrl}" class="cta">
                            <i class="fas fa-home"></i> Voltar ao início
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
