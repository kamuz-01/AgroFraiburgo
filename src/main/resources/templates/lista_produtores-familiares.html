<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtores da Agricultura Familiar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{inicio_usuarios :: inicioStyles}"></th:block>
    
    <style>
        :root {
            --primary-green: #1ba94c; /* Verde principal do botão */
            --primary-hover: #158c3f;
            --bg-light: #f8f9fa;
            --text-dark: #111827;
            --text-gray: #6b7280;
            --border-color: #e5e7eb;
            --badge-bg: #dcfce7;
            --badge-text: #166534;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body.user-shell {
            background-color: #ffffff;
            color: var(--text-dark);
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Header --- */
        .user-page-content > header {
            margin-bottom: 30px;
        }

        .user-page-content > header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .user-page-content > header p {
            color: var(--text-gray);
            font-size: 1rem;
        }

        /* --- Barra de Busca --- */
        .search-container {
            display: flex;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 30px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .search-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: var(--text-gray);
        }

        .search-input-wrapper i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .search-input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .btn-search {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-search:hover {
            background-color: var(--primary-hover);
        }

        /* --- Contagem --- */
        .results-count {
            color: var(--text-gray);
            margin-bottom: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .producer-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 40px;
        }

        .producer-card {
            padding: 20px;
            background: linear-gradient(180deg, #fff, #fbfdf9);
            border-radius: 24px;
            border: 1px solid rgba(23, 49, 31, 0.08);
            box-shadow: 0 10px 28px rgba(18, 40, 26, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .producer-card:hover {
            box-shadow: 0 18px 32px rgba(18, 40, 26, 0.1);
            border-color: rgba(31, 122, 66, 0.16);
        }

        .producer-top {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }

        .avatar {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            color: #fff;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            background: linear-gradient(135deg, #1f7a42, #3fa35d);
            box-shadow: 0 10px 18px rgba(31, 122, 66, 0.25);
            overflow: hidden;
        }

        .avatar.photo {
            padding: 0;
        }

        .avatar.photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .producer-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-dark);
        }

        .producer-meta {
            font-size: 0.9rem;
            color: var(--text-gray);
            line-height: 1.6;
        }

        .producer-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0 18px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 999px;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .producer-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid rgba(23, 49, 31, 0.08);
            text-decoration: none;
            font-weight: 800;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .producer-link:hover {
            transform: translateY(-2px);
        }

        /* --- Botão Carregar Mais --- */
        .load-more-container {
            display: flex;
            justify-content: center;
        }

        .btn-load-more {
            background-color: #fff;
            border: 1px solid var(--border-color);
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            color: #1a202c;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-load-more:hover {
            background-color: #f3f4f6;
        }

        /* Responsividade Mobile */
        @media (max-width: 768px) {
            .producer-grid {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="user-shell">
    <th:block th:replace="~{shared_header :: homeHeader}"></th:block>

    <div class="container user-page-content">
        <header>
            <h1>Produtores da Agricultura Familiar</h1>
            <p>Conheça os produtores locais e entre em contato diretamente com eles</p>
        </header>

        <form class="search-container" action="/produtores" method="get">
            <div class="search-input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" name="q" th:value="${q != null ? q : ''}" placeholder="Buscar produtores por nome, cidade ou especialidade...">
            </div>
            <button class="btn-search" type="submit">
                <i class="fas fa-search"></i> Buscar
            </button>
        </form>

        <div class="results-count">
            <i class="fas fa-user-friends"></i>
            <span th:text="${totalProdutores} + ' produtores encontrados'">0 produtores encontrados</span>
        </div>

        <div class="producer-grid" id="produtoresGrid">

            <article class="producer-card" th:each="p, iter : ${produtores}">
                <div class="producer-top">
                    <div class="avatar photo"
                         th:if="${p.temImagem()}"
                         th:style="${iter.index % 3 == 1} ? 'background: linear-gradient(135deg, #b45309, #f59e0b);' : (${iter.index % 3 == 2} ? 'background: linear-gradient(135deg, #7c3aed, #22c55e);' : '')">
                        <img th:src="@{|${p.imagemPerfil}|}" th:alt="${p.nomeCompleto()}" loading="lazy" />
                    </div>

                    <div class="avatar"
                         th:unless="${p.temImagem()}"
                         th:style="${iter.index % 3 == 1} ? 'background: linear-gradient(135deg, #b45309, #f59e0b);' : (${iter.index % 3 == 2} ? 'background: linear-gradient(135deg, #7c3aed, #22c55e);' : '')"
                         th:text="${p.iniciais}">AA</div>
                    <div>
                        <h3 class="producer-name" th:text="${p.nomeCompleto()}">Produtor</h3>
                        <div class="producer-meta"><i class="fas fa-location-dot"></i> <span th:text="${p.localizacao()}">Fraiburgo, SC</span></div>
                    </div>
                </div>
                <p class="producer-meta">Produção familiar com foco em qualidade e proximidade na região.</p>
                <div class="producer-tags">
                    <span class="tag"><i class="fas fa-star"></i> <span th:text="${#numbers.formatDecimal(p.mediaAvaliacaoNormalizada(), 1, 1)}">0,0</span></span>
                    <span class="tag"><i class="fas fa-users"></i> <span th:text="${p.totalFavoritos} + ' usuários favoritaram'">0 usuários favoritaram</span></span>
                    <span class="tag"><i class="fas fa-seedling"></i> Agricultura familiar</span>
                </div>
                <a class="producer-link" th:href="'/produtores/' + ${p.id}"><i class="far fa-eye"></i> Ver perfil</a>
            </article>

        </div>

        <div class="load-more-container" th:if="${hasMore}" id="loadMoreContainer">
            <button class="btn-load-more" id="btnLoadMore" type="button">Carregar mais produtores</button>
        </div>
    </div>

    <script th:inline="javascript">
        const produtoresGrid = document.getElementById('produtoresGrid');
        const loadMoreButton = document.getElementById('btnLoadMore');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        let currentPage = /*[[${currentPage}]]*/ 0;
        const pageSize = /*[[${pageSize}]]*/ 9;
        const searchTerm = /*[[${q != null ? q : ''}]]*/ '';

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function renderProdutorCard(p, index) {
            const nomeCompleto = escapeHtml(p.nomeCompleto || `${p.nome || ''} ${p.sobrenome || ''}`.trim());
            const localizacao = escapeHtml(p.localizacao || 'Fraiburgo, SC');
            const estrelas = Number(p.mediaAvaliacaoNormalizada ?? 0).toFixed(1);
            const initials = escapeHtml(p.iniciais || '?');
            const accentStyle = index % 3 === 1
                ? 'background: linear-gradient(135deg, #b45309, #f59e0b);'
                : (index % 3 === 2 ? 'background: linear-gradient(135deg, #7c3aed, #22c55e);' : '');
            const fotoHtml = p.temImagem && p.imagemPerfil
                ? `<div class="avatar photo" style="${accentStyle}"><img src="${escapeHtml(p.imagemPerfil)}" alt="${nomeCompleto}" loading="lazy"></div>`
                : `<div class="avatar" style="${accentStyle}">${initials}</div>`;

            return `
                <article class="producer-card">
                    <div class="producer-top">
                        ${fotoHtml}
                        <div>
                            <h3 class="producer-name">${nomeCompleto}</h3>
                            <div class="producer-meta"><i class="fas fa-location-dot"></i> <span>${localizacao}</span></div>
                        </div>
                    </div>
                    <p class="producer-meta">Produção familiar com foco em qualidade e proximidade na região.</p>
                    <div class="producer-tags">
                        <span class="tag"><i class="fas fa-star"></i> <span>${estrelas}</span></span>
                        <span class="tag"><i class="fas fa-users"></i> <span>${Number(p.totalFavoritos ?? 0)} usuários favoritaram</span></span>
                        <span class="tag"><i class="fas fa-seedling"></i> Agricultura familiar</span>
                    </div>
                    <a class="producer-link" href="/produtores/${p.id}"><i class="far fa-eye"></i> Ver perfil</a>
                </article>`;
        }

        if (loadMoreButton) {
            loadMoreButton.addEventListener('click', async () => {
                const nextPage = currentPage + 1;
                loadMoreButton.disabled = true;
                const originalText = loadMoreButton.textContent;
                loadMoreButton.textContent = 'Carregando...';

                try {
                    const url = new URL('/produtores/carregar-mais', window.location.origin);
                    url.searchParams.set('page', nextPage);
                    url.searchParams.set('size', pageSize);
                    if (searchTerm) {
                        url.searchParams.set('q', searchTerm);
                    }

                    const response = await fetch(url.toString());
                    if (!response.ok) {
                        throw new Error('Falha ao carregar produtores');
                    }

                    const data = await response.json();
                    (data.produtores || []).forEach((produtor) => {
                        produtoresGrid.insertAdjacentHTML('beforeend', renderProdutorCard(produtor, producersGridIndex()));
                    });

                    currentPage = data.currentPage;

                    if (!data.hasMore && loadMoreContainer) {
                        loadMoreContainer.remove();
                    } else {
                        loadMoreButton.disabled = false;
                        loadMoreButton.textContent = originalText;
                    }
                } catch (error) {
                    console.error(error);
                    loadMoreButton.disabled = false;
                    loadMoreButton.textContent = originalText;
                    alert('Não foi possível carregar mais produtores no momento.');
                }
            });
        }

        function producersGridIndex() {
            return produtoresGrid ? produtoresGrid.children.length : 0;
        }
    </script>

</body>
</html>
