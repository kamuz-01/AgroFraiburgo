<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | AgroFraiburgo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos-recuperacao_senha.css}">
</head>
<body>
    <main class="reset-shell">
        <section class="reset-panel">
            <span class="eyebrow">AgroFraiburgo</span>
            <h1>Recuperar senha</h1>
            <p>
                Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.
            </p>
            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

            <form th:action="@{/recuperar_senha}" method="post" class="reset-form">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>
                <button type="submit" class="btn-primary">Enviar link de recuperação</button>
                <a class="btn-secondary-link" th:href="@{/login}">Voltar para o login</a>
            </form>
        </section>
    </main>
</body>
</html>
