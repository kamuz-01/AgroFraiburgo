<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 	<!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <th:block th:replace="~{inicio_usuarios :: inicioStyles}"></th:block>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/estilos-home_moderador.css">
    <link rel="icon" href="imagens/favicon.png" type="image/x-icon">
<title>Produtores pendentes</title>
<style>
    .mobile-pendentes-wrap {
        display: block;
        padding: 0 14px 28px;
    }

    .pendentes-page-shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 24px 32px;
    }

    .mobile-pendentes-head {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
    }

    .mobile-pendentes-head h2 {
        font-size: 1.35rem;
        font-weight: 800;
        color: #17311f;
        margin: 0;
    }

    .mobile-pendentes-head p {
        margin: 0;
        color: #5c6f60;
    }

    .mobile-pendentes-cards {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .mobile-pendente-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(23, 49, 31, 0.08);
        border-radius: 22px;
        box-shadow: 0 14px 30px rgba(18, 40, 26, 0.08);
        padding: 16px;
        display: grid;
        gap: 12px;
        text-decoration: none;
        color: #17311f !important;
    }

    .mobile-pendente-card:hover {
        background: #fff;
        color: #17311f !important;
        text-decoration: none;
    }

    .mobile-pendente-card__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
    }

    .mobile-pendente-card__name {
        font-size: 1.02rem;
        font-weight: 800;
        color: #17311f;
    }

    .mobile-pendente-card__meta {
        color: #5c6f60;
        font-size: 0.92rem;
        line-height: 1.5;
    }

    .pendentes-toolbar {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
        padding: 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(23, 49, 31, 0.08);
        box-shadow: 0 14px 30px rgba(18, 40, 26, 0.08);
    }

    .pendentes-toolbar .form-label {
        color: #17311f;
        margin-bottom: 0;
    }

    .pendentes-toolbar .input-group-text,
    .pendentes-toolbar .form-control,
    .pendentes-toolbar .btn {
        border-radius: 14px;
    }

    .pendentes-toolbar .form-control:focus {
        box-shadow: 0 0 0 0.18rem rgba(31, 122, 66, 0.12);
        border-color: #1f7a42;
    }

    .pendentes-resumo {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #5c6f60;
        font-size: 0.9rem;
        flex-wrap: wrap;
    }

    .pendentes-resumo strong {
        color: #17311f;
    }

    .mobile-pendente-card__status {
        font-size: 0.75rem;
        font-weight: 800;
        padding: 6px 10px;
        border-radius: 999px;
        background: #fff7ed;
        color: #9a3412;
        white-space: nowrap;
    }

    .mobile-pendente-card__action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1f7a42, #2d8c4f);
        color: #fff;
        font-weight: 800;
        text-decoration: none;
    }

    .mobile-pendente-card__action:hover {
        color: #fff;
    }

    .mobile-pendente-card.is-loading {
        position: relative;
        overflow: hidden;
        pointer-events: none;
    }

    .mobile-pendente-card.is-loading::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(31, 122, 66, 0.08) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: mobile-pendente-shimmer 1.25s ease-in-out infinite;
    }

    .mobile-pendente-card__skeleton {
        display: grid;
        gap: 10px;
    }

    .mobile-pendente-card__skeleton-line {
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, #e9f4ec 0%, #d8eadf 50%, #e9f4ec 100%);
        background-size: 200% 100%;
    }

    .mobile-pendente-card__skeleton-line--title {
        width: 72%;
        height: 16px;
    }

    .mobile-pendente-card__skeleton-line--short {
        width: 48%;
    }

    .mobile-pendente-card__skeleton-line--button {
        width: 58%;
        height: 38px;
        border-radius: 14px;
        margin-top: 4px;
    }

    .mobile-pendente-card__loading-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.78rem;
        font-weight: 800;
        color: #1f7a42;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .mobile-pendente-card__loading-label::before {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(31, 122, 66, 0.18);
        border-top-color: #1f7a42;
        border-right-color: #2d8c4f;
        animation: mobile-pendente-spin 0.85s linear infinite;
    }

    .lupa{
        background-color: #5c6f60;
        color: whitesmoke;
        font-weight: bolder;
    }

    @keyframes mobile-pendente-spin {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes mobile-pendente-shimmer {
        from {
            transform: translateX(-100%);
        }
        to {
            transform: translateX(100%);
        }
    }

    @media (max-width: 991.98px) {
        .mobile-pendentes-wrap {
            display: block;
        }

        .mobile-pendentes-cards {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 575.98px) {
        .mobile-pendentes-cards {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body class="user-shell">
   <th:block th:replace="~{shared_header :: homeHeader}"></th:block>

    <div class="container-fluid pendentes-page-shell">
        <section class="mobile-pendentes-wrap px-0">
            <div class="mobile-pendentes-head">
                <h2>Produtores pendentes</h2>
                <p>Filtre por CPF e abra a análise do cadastro.</p>
            </div>

            <div class="pendentes-toolbar">
                <label for="filtroCpf" class="form-label">Buscar por CPF</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                    <input id="filtroCpf" type="search" class="form-control" placeholder="Digite o CPF para filtrar" inputmode="numeric" autocomplete="off">
                    <button class="btn btn-outline-secondary lupa" type="button" id="limparFiltroCpf">Limpar</button>
                </div>
                <div class="pendentes-resumo">
                    <span id="pendentesResumo">Carregando pendências...</span>
                    <strong id="pendentesAtivos"></strong>
                </div>
            </div>

            <div id="mobilePendentesCards" class="mobile-pendentes-cards"></div>
        </section>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/csrf.js"></script>
    
    <script th:inline="none">
    document.addEventListener('DOMContentLoaded', () => {
        const cardsContainer = document.getElementById('mobilePendentesCards');
        const filtroCpf = document.getElementById('filtroCpf');
        const limparFiltroCpf = document.getElementById('limparFiltroCpf');
        const pendentesResumo = document.getElementById('pendentesResumo');
        const pendentesAtivos = document.getElementById('pendentesAtivos');

        let todosProdutores = [];

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[character]));

        const apenasDigitos = (value) => String(value ?? '').replace(/\D/g, '');

        const formatarCpf = (value) => {
            const digits = apenasDigitos(value);
            if (digits.length !== 11) {
                return value ? String(value) : '';
            }

            return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        };

        const renderLoadingCards = () => {
            if (!cardsContainer) {
                return;
            }

            cardsContainer.innerHTML = Array.from({ length: 3 }).map(() => `
                <div class="mobile-pendente-card is-loading" aria-busy="true" aria-label="Carregando produtores pendentes">
                    <div class="mobile-pendente-card__loading-label">Carregando pendências</div>
                    <div class="mobile-pendente-card__skeleton">
                        <div class="mobile-pendente-card__skeleton-line mobile-pendente-card__skeleton-line--title"></div>
                        <div class="mobile-pendente-card__skeleton-line"></div>
                        <div class="mobile-pendente-card__skeleton-line mobile-pendente-card__skeleton-line--short"></div>
                        <div class="mobile-pendente-card__skeleton-line mobile-pendente-card__skeleton-line--button"></div>
                    </div>
                </div>
            `).join('');
        };

        const renderEmptyState = (message) => {
            cardsContainer.innerHTML = `
                <div class="mobile-pendente-card">
                    <div class="mobile-pendente-card__name">${escapeHtml(message)}</div>
                    <div class="mobile-pendente-card__meta">Tente ajustar o CPF informado ou volte mais tarde.</div>
                </div>
            `;
        };

        const renderCards = () => {
            const filtro = apenasDigitos(filtroCpf?.value);
            const filtrados = filtro
                ? todosProdutores.filter((produtor) => apenasDigitos(produtor.cpf).includes(filtro))
                : todosProdutores;

            if (pendentesResumo) {
                pendentesResumo.textContent = filtro
                    ? `Mostrando ${filtrados.length} de ${todosProdutores.length} pendentes para o CPF pesquisado.`
                    : `Total de ${todosProdutores.length} produtores pendentes.`;
            }

            if (pendentesAtivos) {
                pendentesAtivos.textContent = filtro ? `CPF: ${filtroCpf.value.trim()}` : '';
            }

            if (!cardsContainer) {
                return;
            }

            if (!filtrados.length) {
                renderEmptyState(filtro ? 'Nenhum produtor encontrado' : 'Nenhum produtor pendente');
                return;
            }

            cardsContainer.innerHTML = filtrados.map((produtor) => {
                const id = produtor.idUsuario ?? produtor.id ?? '';
                const nomeCompleto = produtor.nomeCompleto || `Produtor #${id}`;
                const cpfFormatado = formatarCpf(produtor.cpf);
                const local = `${produtor.cidade ?? 'Fraiburgo'}, ${produtor.estado ?? 'SC'}`;
                const status = produtor.statusConta ?? 'PENDENTE';

                return `
                    <a class="mobile-pendente-card" href="/produtores_pendentes/${id}">
                        <div class="mobile-pendente-card__header">
                            <div>
                                <div class="mobile-pendente-card__name">${escapeHtml(nomeCompleto)}</div>
                                <div class="mobile-pendente-card__meta">CPF: ${escapeHtml(cpfFormatado)}</div>
                            </div>
                            <span class="mobile-pendente-card__status">${escapeHtml(status)}</span>
                        </div>
                        <div class="mobile-pendente-card__meta">${escapeHtml(local)}</div>
                        <span class="mobile-pendente-card__action">
                            <i class="fas fa-folder-open"></i>
                            Abrir análise
                        </span>
                    </a>
                `;
            }).join('');
        };

        const carregarPendentes = async () => {
            try {
                renderLoadingCards();
                const response = await axios.get('/api/moderador/produtores/pendentes', { withCredentials: true });
                todosProdutores = Array.isArray(response.data) ? response.data : [];
                renderCards();
            } catch (error) {
                console.error('Erro ao carregar pendências', error);
                renderEmptyState('Erro ao carregar pendências');
                if (pendentesResumo) {
                    pendentesResumo.textContent = 'Atualize a página para tentar novamente.';
                }
            }
        };

        filtroCpf?.addEventListener('input', renderCards);

        limparFiltroCpf?.addEventListener('click', () => {
            if (filtroCpf) {
                filtroCpf.value = '';
                filtroCpf.focus();
            }

            renderCards();
        });

        carregarPendentes();
    });
</script>

</body>
</html>
