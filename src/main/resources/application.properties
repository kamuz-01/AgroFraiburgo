spring.application.name=AgroFraiburgo

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${Driver_Class_Name}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Em ambiente com schema criado manualmente, o Flyway fica desativado para não validar/aplicar migrations no startup.
spring.jpa.defer-datasource-initialization=false
 
# Migrations (Flyway)
spring.flyway.enabled=false
 
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.check-template-location=true
spring.web.resources.static-locations=classpath:/static/,file:imagens-usuarios/,file:documentos-produtores/

# JWT bootstrap opcional. Se houver JWT_SECRET no ambiente, ele é usado apenas para inicializar a primeira chave.
jwt.bootstrap-secret=${JWT_SECRET:}
# Tempo de expiração do token (7 dias em segundos)
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS}
# Cookies HTTP-only. Em ambiente local via HTTP, deixe false; em HTTPS/produção, habilite true.
app.cookie.secure=${APP_COOKIE_SECURE:false}
# Renova o cookie/JWT somente quando o token estiver próximo da expiração.
jwt.refresh-window-seconds=${JWT_REFRESH_WINDOW_SECONDS:600}
# Rotação automática das chaves JWT. A retenção da chave precisa cobrir o intervalo de rotação mais o TTL do access token, para não invalidar tokens ainda válidos.
jwt.rotation-interval-ms=${JWT_ROTATION_INTERVAL_MS:86400000}
jwt.rotation-check-ms=${JWT_ROTATION_CHECK_MS:3600000}
# Valor temporário para o emissor  
jwt.issuer={JWT_ISSUER}

# Tamanho máximo de cada arquivo
spring.servlet.multipart.max-file-size=5MB
# Tamanho máximo da requisição (somando todos os arquivos + campos)
spring.servlet.multipart.max-request-size=20MB

# Configuração do google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Configurações do Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v8.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v8.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture.width(400).height(400)

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=${Rabbitmq_Port}
spring.rabbitmq.username=${Rabbitmq_Username}
spring.rabbitmq.password=${Rabbitmq_Password}
spring.amqp.deserialization.trust.all=true
fila.bloqueios=${Rabbitmq_Fila_Bloqueios}

# Mail (SMTP)
spring.mail.host=${Spring_Hostname}
spring.mail.port=${Spring_Mail_port}
spring.mail.username=${Spring_Mail_Username}
spring.mail.password=${Spring_Mail_Senha}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${Spring_Mail_From}
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.ssl.trust=${Spring_Mail_SMTP}

# Neo4j (recomendações) — defaults locais para uso com Neo4j Desktop
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.neo4j.database=${NEO4J_DATABASE:neo4j}

# Habilita a consulta de recomendações via Neo4j (fallback se false)
agro.recomendacao.neo4j.enabled=${NEO4J_ENABLED:true}

# Configuracoes de logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE

# pasta e arquivo principal de logs
logging.file.name=logs/app.log

# Rate limit mínimo para proteção do login por IP
app.security.login.ip.max-attempts=20
app.security.login.ip.window-minutes=15
app.security.login.ip.block-minutes=30
app.security.login.ip.cleanup.retention-days=30
app.security.login.ip.cleanup.fixed-delay-ms=86400000

# Expõe métricas do actuator para inspeção operacional
management.endpoints.web.exposure.include=health,info,metrics