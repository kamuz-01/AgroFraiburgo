# Test overrides: avoid depender de variáveis de ambiente locais
spring.datasource.url=jdbc:h2:mem:agro_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Não criar/validar schema para teste de contexto
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (dummy)
jwt.secret=test-secret
jwt.access-token-ttl-seconds=604800
jwt.issuer=test-issuer

# OAuth2 (dummy)
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.facebook.client-id=test
spring.security.oauth2.client.registration.facebook.client-secret=test

# RabbitMQ (dummy)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
fila.bloqueios=test

# Não iniciar consumidores/listeners em testes
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Mail (dummy)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.from=no-reply@localhost
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.ssl.trust=localhost
